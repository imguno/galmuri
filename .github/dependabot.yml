version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # This unpublished companion is selected by a trusted repository commit,
      # never by an unrelated package with the same public-index name.
      - dependency-name: duru
